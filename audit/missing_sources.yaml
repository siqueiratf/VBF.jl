# audit/missing_sources.yaml
#
# Every paper, theorem, author, dataset, script or number that a README, a paper
# directory or a core source file REFERS TO but that is not on disk in this
# repository. The audit rule is: never name in report.md anything that is not on
# disk -- log it here instead. Each entry records what refers to it, what it is
# needed for, and what it blocks.
#
# `verified_absent` means this audit ran a find/grep and confirmed the file is
# not present anywhere outside .git.

meta:
  generated_utc: "2026-08-17T17:00:00Z"
  method: "grep -rl over *.jl, *.md, *.toml and Makefile for each referenced name, plus find over the worktree"
  entries: 18


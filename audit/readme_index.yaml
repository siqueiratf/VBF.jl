# audit/readme_index.yaml — Pass 1.
#
# One record per paper-associated README, built by grepping and stat-ing the tree
# on 2026-08-17 against working-tree state (HEAD bf15e59 + uncommitted changes),
# NOT by trusting any README's claims about the repository.
#
# paper_text_on_disk : is the paper itself present under <dir>/input/ ?
# implementation     : paper-local claim files (*.jl at the paper root) and any
#                      packages/*/src file carrying `@cite <paper_id>`
# reproducing_test   : the paper's own test directory and its @test count
# readme_test_claim  : what the README says about running the suite. `stale_no_julia`
#                      means the README records "could not run - no Julia toolchain",
#                      which is FALSE on this machine (Julia 1.12.6 is installed and
#                      bench/calibration.toml was measured with it). Those READMEs'
#                      numeric claims are Python/C re-derivations, never re-run here.

scan:
  date_utc: "2026-08-17"
  method: "find papers/*/*/README.md; read all 42 in full; ls input/ *.jl test|tests; grep -rl '@cite <id>' packages/*/src; sqlite3 on BFA_catalog.sqlite and ccz_sigma_index.sqlite"
  papers_scanned: 42
  readmes_with_paper_text_on_disk: 42
  readmes_with_paper_local_implementation: 42
  readmes_with_test_directory: 42
  papers_with_no_implementation: 0
  papers_with_no_paper_text: 0
  core_src_files_citing_a_scanned_paper: 16
  papers_cited_by_core_src: 6   # Canteaut_201906, Canteaut_202205, Beierle_202201, Taniguchi_201909, Ichanska_202400, Edel_200900
  test_dir_named_tests_not_test: 6   # Taniguchi_201909, Calderini_202009, Li_202207, Ichanska_202400, Li_202402, Yu_202512
  readmes_claiming_no_julia_toolchain: 6   # Budaghyan_200904, Budaghyan_200910, Edel_200900,
                                           # Bracken_201103, Yuyin_201300, Tang_201510 -- all
                                           # stale: their catalog-gap LUTs come from Python/C
                                           # re-implementations and were never regenerated under Julia

catalog_state:
  curated_toml_entries: {n4: 1, n5: 3, n6: 3, n7: 8, n8: 5, n9: 9, n10: 4, n12: 2}
  bulk_corpora_all_n8: true
  bulk_corpora: {edelpott2009_n8: 22, wengtangong2013_n8: 10, yuwangli2014_qam_n8: 8179,
                 taniguchi2019_n8: 2, beierleleander2022_n8: 12923,
                 beierleleanderperrin2022_n8: 6368, yuperrin2022_qam_n8: 5412,
                 simonberg_gf4_n8: 196863}
  sigma_index_rows: 230404
  sigma_index_distinct_sigma: 33416
  sigma_index_sources: 9
  no_corpus_exists_for_n: [9, 10, 11, 12]


      to_build:
        - a commutant enumerator Comm(M) over GL(n, F2)
        - isSmallest (lexicographic minimum under C_B o F o C_A), gated by depth <= t
        - Definition 5 is_extendable plus Lemma 6's seeding of Ord(A,1) with the unique 3-bit

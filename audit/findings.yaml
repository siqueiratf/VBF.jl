      how_a_candidate_would_be_certified_new: >-
        an APN permutation found in a class the paper reports empty would be certified by an
        ortho-derivative signature mismatch against the n=6/n=7/n=8 sigma index; at n=6 and n=7
        that index is effectively complete, so the certificate would be strong. At n=8 the index

  - id: F070
    paper_id: Bracken_201205
    also_implicated: []
    readme: >-
      papers/2012/Bracken_201205/README.md
    paper_locator: Bracken-Tan-Tan 2012, Theorem 1.1 (the t=2 differentially-4-uniform binomial permutation)
    verification_tier: readme_only
    tiers: [readme_only]
    severity: medium
    kind: inferred
    quote: null
    description: >-
      INFERRED from the parameter range, not from author text: for k=2 the admissible s are
      exactly s = 4 (mod 6), and then both exponents collapse to 17 (mod 63), so F degenerates
      to the monomial (a+a^4) x^17, linear-equivalent to Gold x^5. The paper's first class of
      binomial differentially 4-uniform permutations therefore has NO genuine binomial
      representative below n=30, a scope caveat the paper never states. The README reports the
      n=30 instance IS reachable: permutation verified exhaustively over all 2^30 inputs in 4 m
      55 s in C, and dim ker D_a F = 2 for 200,000 random nonzero a.
    region_searched: >-
      the 12 feasible (k,s) instances with n=3k <= 15, of which the reproduction exercises 3
    region_left: >-
      n=30 (k=10, s=2), the smallest genuine t=2 permutation instance
    region_size: >-
      2^30 inputs for the permutation check; the differential half is a rank test per direction
    region_size_stated_by_authors: false
    method: >-
      exponent arithmetic mod 2^n - 1 over the admissible parameter grid
    method_completeness: complete_within_region
    verify_and_crossref:
      entry_point: >-
        papers/2012/Bracken_201205/helpers.jl:31; report.jl:28-33
      implementation_status: >-
        partial
      to_build:
        - a paper-local degree-30 primitive polynomial constant, since core's
        PRIMITIVE_POLYNOMIALS stops at 16, with an explicit primitivity assertion on alpha=2
        - an opt-in (k=10, s=2) case behind full_search running the streaming permutation check
        - a rank-based derivative check dim ker D_a F == t with a samples limit
      supersession: >-
        CHECKED. Bracken_201103, the sibling quadrinomial paper, is reproduced and its helpers
        already provide the machinery Problem 5.1 needs, so no new mathematics is required.
      recomputation: >-
        NOT re-run. The n=30 figures are the README's C measurements and are explicitly carried
        here as another machine's numbers.
    exploitability:
      what_about_our_stack_changes_the_picture: >-
        F is quadratic, so its DDT rows are kernels of an F2-linear derivative and never need a
        materialised DDT; the permutation test needs only a 128 MB bitmap. That is the mechanism
        -- a rank test replacing a DDT -- and it is what makes n=30 reachable at all.
      positive_control_before_believing_novel_output: >-
        the n=6 and n=15 instances must reproduce their published differential spectra {0,4} and
        {0,2} -- they do, and are re-confirmed under Julia in the README
      how_a_candidate_would_be_certified_new: >-
        not applicable -- the paper's object is differentially 4-uniform, not APN, so it is out
        of catalog scope entirely
      what_would_kill_the_lead_and_after_how_much_compute: >-
        an n=30 permutation check returning false would refute the paper's headline; the README
        reports it returns true
    cost_model:
      unit: >-
        streaming permutation check at n=30
      units_required: 1
      measured_seconds_per_unit: 295.0
      calibration_key: >-
        unknown -- the README's C measurement on another machine, NOT a calibration key and NOT
        re-measured here; Julia will be slower
      core_hours: 0.082
      gpu_path: >-
        yes -- a 2^30 bitmap permutation check is a natural GPU kernel
      parallelism: >-
        the permutation half is a single streaming pass; the differential half is embarrassingly
        parallel over directions a
      assumptions: >-
        core PRIMITIVE_POLYNOMIALS stops at 16, so a degree-30 modulus must be supplied and its
        primitivity asserted
      largest_unquantified_uncertainty: >-
        LARGEST for this finding: 295 s is a C figure from another machine. A Julia streaming
        check could plausibly be 3-10x slower; no n=30 work is calibrated on this machine at
        all.


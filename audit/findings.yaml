      but never states how two pairs are compared. Under the STANDARD lexicographic order three
      members of beierleleander2022_n8 (indices 9172, 9624, 10320) have a level-5 pair (30,46)
      that does not appear in Table 4.1 -- yet the table's counts sum to exactly 32,892, i.e. it
      claims to be exhaustive. Under the alternative reading maximise b then MINIMISE K, all
      three land back inside the table. So Table 4.1 is consistent with only one order, which
      the paper never states, and about 26% of that corpus has a rank-4 component, so the
      discrepancy would affect 3,000+ functions rather than a handful.

  - id: F022
    paper_id: Kuznetsov_202606
    also_implicated: []
    readme: >-
      papers/2026/Kuznetsov_202606/README.md
    paper_locator: Kuznetsov 2026, Sect. V-A (the 16-bit slice signature) and Algorithm 1
    verification_tier: recomputed
    tiers: [readme_only, recomputed]
    severity: high
    kind: unsound_negative
    quote: null
    description: >-
      Because the projection V_A -> center coordinates is injective (F010), there are 2^40
      slices, and a 16-bit slice signature cannot separate them. Algorithm 1's deduplication
      therefore collapses DISTINCT slices, so any this-slice-was-already-seen decision -- and
      with it the search's coverage accounting -- is unsound. This is a pruning-rule defect,
      squarely inside the include filter.
    region_searched: >-
      428 slices reported searched
    region_left: >-
      2^40 - 428, about 1.0995e12 slices
    region_size: >-
      2^40 = 1099511627776
    region_size_stated_by_authors: true
    method: >-
      Groebner-basis solve per slice (msolve via AlgebraicSolving), with a 16-bit signature
      dedup
    method_completeness: pruned_search
    verify_and_crossref:
      entry_point: >-
        papers/2026/Kuznetsov_202606/algorithm1.jl; phase2.jl, which reimplements the Groebner
        half open-source and passes 6/6 against two embedded author slices
      implementation_status: >-
        implemented_tested
      to_build:
        - a 40-bit (or full-basis) slice signature
        - an explicit coverage denominator of 2^40 in the report rather than 65536
        - a SearchOutcome return from Algorithm 1 so partial coverage cannot read as exhaustion
      supersession: >-
        CHECKED. No later work in the repo revisits Kuznetsov's slice search.
      recomputation: >-
        the 2^40 figure is ours (F010). The paper's 65536 is refuted.
    exploitability:
      what_about_our_stack_changes_the_picture: >-
        The reproduction ALREADY replaced the paper's Magma Groebner step with open-source
        msolve/AlgebraicSolving and reproduces two real author slices exactly. That is a
        concrete open-source path around a proprietary dependency, and it is already working.
      positive_control_before_believing_novel_output: >-
        the two author slices embedded in test/test_phase2.jl -- one 4-solution MULTI slice and
        one 1-solution SINGLE slice -- must reproduce by exact set equality; they do, 6/6 in
        59.9 s
      how_a_candidate_would_be_certified_new: >-
        a function found in an unvisited slice would be certified by sigma mismatch against the
        230,404-row index. At n=8 that index covers 8 corpora including simonberg_gf4_n8 with
        196,863 members, so it is the strongest novelty certificate this repo can issue -- but
        about 32,892 n=8 quadratic APN classes were known through 2021 and a 2025 construction
        raised that past 3.7 million, and the 3.7M set is NOT in the index. A fresh n=8 class is
        therefore cheap and of low marginal value.
      what_would_kill_the_lead_and_after_how_much_compute: >-
        if a sample of unvisited slices yielded only functions already sigma-matched, the lead
        would be low-value rather than dead. At 30.7 s per slice a 1000-slice sample costs 8.5
        core hours and would give an empirical hit rate.
    cost_model:
      unit: >-
        one Groebner slice solve at n=8
      units_required: 1000
      measured_seconds_per_unit: 30.71
      calibration_key: >-
        groebner_slice_n8_single
      core_hours: 8.5
      gpu_path: >-
        no -- msolve is CPU-bound
      parallelism: >-
        embarrassingly parallel over slices; 12 threads on this machine gives 0.71 wall hours
        per 1000 slices
      assumptions: >-
        slice cost is uniform at the calibrated 30.71 s; the calibration used 3 repetitions on
        our smallest reference APN system and returned 1 solution
      largest_unquantified_uncertainty: >-
        LARGE: exhausting V_A is 2^40 slices x 30.71 s = 9.4e12 core hours, i.e. not a candidate
        for any budget. Only sampling is affordable, so no emptiness claim can ever come out of
        this.


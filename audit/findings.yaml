        stronger than the catalog's 9 or 4 rows.
      recomputation: >-
        ours: bulk_corpora returns 8 rows, all n=8 and degree 2, totalling 229,779 members; the
        sigma index adds 625 catalog functions for 230,404 rows and 33,416 distinct sigma.
        classify_ccz on an n=9 function returns (:new, nothing, nothing) with no coverage

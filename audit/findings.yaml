      repository contains a standing proof of this: Yu-Kaleyski-Budaghyan-Li's f_7, which THAT
      PAPER treats as known, also classifies :new. Any n >= 9 novelty claim built on
      classify_ccz is therefore worthless without an external check, and this audit's own probe

      supersession: >-
        CHECKED, and the picture CHANGED since the README was written: the working tree now
        carries packages/VBF/src/search/outcome.jl, a three-case SearchOutcome type (Found /
        Exhausted / BudgetHit) whose certified_empty_region is defined ONLY on Exhausted, and

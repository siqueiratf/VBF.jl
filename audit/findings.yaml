# audit/findings.yaml -- Passes 2-5 of the audit.
#
# One record per defect or boundary. A defect is INCLUDED when it changes what a
# machine computes: a parameter condition or admissible range, a coefficient /
# exponent / index / field element in a stated construction, the direction or
# quantifier of a claim, a reported count / cardinality / spectrum, an algorithm's
# pruning rule / termination condition / search order, the scope of a coverage
# claim where the method reached less than the claim asserts, or the status of a
# hypothesis stated as proved when it was only verified on examples.
# EXCLUDED: prose, semantically harmless notation drift, formatting, bibliography
# errors, figure mislabels.
#
# verification_tier -- the strongest tier reached; `tiers` lists all reached.
#   readme_only     asserted in a README, nothing on disk confirms it
#   paper_confirmed located in the paper's own text (section/theorem/table given)
#   code_confirmed  our implementation encodes the corrected or limiting behaviour
#   recomputed      this audit ran it; output agrees or disagrees with the figure
# readme_only findings are the audit backlog. They are NEVER ranked above a
# paper_confirmed finding.
#
# kind: wrong_condition | wrong_value | unsound_negative | sampling_not_exhaustion
#     | scope_restriction | hard_limit | tool_limit | theory_limit
#     | unproved_premise | internal_inconsistency | inferred
# `inferred` = the boundary was derived from a table or parameter range rather
# than from author text; segregated in the report and capped at medium confidence.
#
# All `recomputed` figures were produced on 2026-08-17 on this machine
# (AMD Ryzen 5 5600G, 12 threads, 30.7 GB) with Julia 1.12.6 against
# packages/VBF + packages/VBFCatalog in the current working tree. Timings they
# rely on are in bench/calibration.toml.


# ── the reproduction outcome ────────────────────────────────────────────────
#
# `audit/readme_index.yaml` records the verdict of each README in prose. This
# section maps every prose verdict to one of four classes, so a count is
# possible. The script aborts on a verdict that this section does not name.

[verdict_class]
"Complete" = "complete"
"Reproduced" = "complete"
"Good" = "mostly_complete"
"Good, with two scoped gaps" = "mostly_complete"
"Mostly complete" = "mostly_complete"
"Partial → repaired" = "mostly_complete"
"Partial" = "partial"
"unstated" = "unstated"

# ── the construction method group of a catalog object ───────────────────────
#
# The codes come from manuscript/generate_catalog_table.jl:
#   A1 monomial (power) families      B1 QAM search
#   A2 polynomial and multinomial     B2 tree, trim and extension search
#   A3 bivariate and biprojective     B3 restricted-coefficient sweep
#   A4 isotopic shift and switching   B4 published targeted enumerations
#   C  CCZ-class representative sets   D  sporadic individual results

[bib_group]
Gold_196801       = "A1"
Kasami_197105     = "A1"
Nyberg_199400     = "A1"
Dobbertin_199905  = "A1"
Dobbertin_199905b = "A1"
Dobbertin_200100  = "A1"
Budaghyan_200603  = "A2"
Budaghyan_200809  = "A2"
Budaghyan_200910  = "A2"
Browning_201000   = "A2"
Taniguchi_201909  = "A2"
Calderini_202100  = "A3"
Calderini_202306  = "A3"
Taniguchi_202501  = "A4"
Edel_200900       = "B4"
WengTanGong_201300 = "B4"
Yu_201411         = "B1"
Yu_202211         = "B1"
Beierle_202201    = "B2"
Beierle_202500    = "B2"
Yu_202012         = "D"


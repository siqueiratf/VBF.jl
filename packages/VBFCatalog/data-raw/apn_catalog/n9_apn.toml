# --- Welch / Niho (coincide at n=9) -----------------------------------------

[[apn_functions]]
name              = "n9_Welch_Niho_x19"
description       = "Welch and Niho APN both yield x^19 = x^(2^4 + 3) for n=9 (t=4 even). The two families coincide here."
n                 = 9
m                 = 9
is_permutation    = true
algebraic_form    = "x^19 in GF(2^9), modulus x^9 + x^4 + 1"
bib_key           = "Nyberg1994"
source            = "Welch x^(2^t + 3); Niho x^(2^t + 2^(t/2) - 1) for t even; equal for n=9. APN-ness per Canteaut-Charpin-Dobbertin and Hollmann-Xiang."
monomial_exponent = 19

# --- Inverse ----------------------------------------------------------------

[[apn_functions]]
name              = "n9_Inverse_x510"
description       = "Inverse function x^510 = x^(2^9 - 2) over GF(2^9). APN because n is odd."
n                 = 9
m                 = 9
is_permutation    = true
algebraic_form    = "x^510 in GF(2^9), modulus x^9 + x^4 + 1"
bib_key           = "Nyberg1994"
source            = "Nyberg, EUROCRYPT 1994 — inverse function is APN for odd n."
monomial_exponent = 510

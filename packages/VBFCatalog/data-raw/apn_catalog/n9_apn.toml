# n = 9 APN functions (monomial entries).
#
# n = 9 is odd and 2^9 - 1 = 511 = 7 · 73. Most monomial APN exponents
# are coprime with 511 and therefore induce permutations.
#
# Welch and Niho coincide for n=9 (both yield x^19) so a single entry
# covers both family attributions.
#
# Modulus: x^9 + x^4 + 1 (primitive_polynomial(9) = 529).

schema_version = 1

# --- Gold (i = 1, 2, 4 up to CCZ) -------------------------------------------

[[apn_functions]]
name              = "n9_Gold_x3"
description       = "Gold APN x^3 over GF(2^9), modulus x^9+x^4+1. i=1."
n                 = 9
m                 = 9
is_permutation    = true
algebraic_form    = "x^3 in GF(2^9), modulus x^9 + x^4 + 1"
bib_key           = "Gold1968"
source            = "Gold, IEEE Trans. Inf. Theory 1968."
monomial_exponent = 3

[[apn_functions]]
name              = "n9_Gold_x5"
description       = "Gold APN x^5 over GF(2^9). i=2."
n                 = 9
m                 = 9
is_permutation    = true
algebraic_form    = "x^5 in GF(2^9), modulus x^9 + x^4 + 1"
bib_key           = "Gold1968"
source            = "Gold, IEEE Trans. Inf. Theory 1968."
monomial_exponent = 5

[[apn_functions]]
name              = "n9_Gold_x17"
description       = "Gold APN x^17 = x^(2^4 + 1) over GF(2^9). i=4."
n                 = 9
m                 = 9
is_permutation    = true
algebraic_form    = "x^17 in GF(2^9), modulus x^9 + x^4 + 1"
bib_key           = "Gold1968"
source            = "Gold, IEEE Trans. Inf. Theory 1968."
monomial_exponent = 17


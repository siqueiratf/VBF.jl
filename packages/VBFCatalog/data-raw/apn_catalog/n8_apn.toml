# --- Taniguchi-Polujan-Pott-Arshad (2025) Example 4.2 — codim-2 modification --

[[apn_functions]]
name              = "n8_Taniguchi2025_ex4_2"
description       = "Codimension-two modification of Gold x^3 on GF(2^8): constants added on the four cosets of ker(Tr_2^8). Example 4.2 of Taniguchi-Polujan-Pott-Arshad (2025). PRIOR ART - THIS IS NOT A NEW CCZ CLASS: this function is EA-equivalent, hence CCZ-equivalent (both are quadratic APN, Yoshiara), to Budaghyan-Carlet-Leander (2009) eq. (6) x^3 + a^-1*Tr_8(a^3*x^9) with a = alpha the generator, over the same modulus 285. Decided in-repo, not inferred: ea_mappings_from_ortho_derivative returns 3072 EA mappings against that function, and are_ea_equivalent and are_ccz_equivalent both return true under on_inconclusive = :throw. The two lookup tables differ, so this is a constructed equivalence and not an identity. Negative control: the same routine returns false for this entry against n8_Gold_x3. Rebuild the 2009 function with apn_eq6(8, 2; modulus = 285) from packages/VBFRepro/src/200910-budaghyan-apn-families/helpers.jl. The entry is kept because this catalog indexes named functions and admits CCZ-duplicates under distinct names; only the attribution is corrected. OPEN: Edel-Pott function 1.3 may be this same class a third time - packages/VBFRepro/src/202101-budaghyan-generalized-shifts/README.md reports an identical extended Walsh spectrum, identical ortho-derivative differential and Walsh spectra and |S(F)| = 86 - but no witness is constructed, so that leg is undecided. Re-verified in-repo: differential_uniformity = 2, algebraic_degree = 2, is_permutation = false. This entry is CCZ-inequivalent to n8_Gold_x3, n8_Gold_x9 and n8_Calderini2021_thm62 by the same complete quadratic-APN path; that is a statement about those three entries and is NOT evidence of novelty in the literature. Against the degree-4 n8_Kasami_x57 only EA-inequivalence is verified in-repo (algebraic degree 2 vs 4); the CCZ-class enumeration for n=8 did not terminate (killed after 900 s) and Gamma-rank is refused by the n>=8 design-rank guard, so CCZ-inequivalence to Kasami rests on the literature (Yoshiara 2016: a power APN function is CCZ-equivalent to a quadratic APN function only if it is EA-equivalent to a Gold function, which the degree-4 x^57 is not) and is NOT verified here. The paper's Gamma-rank values (13842 for the paper's G vs 11818 for x^3) are likewise unverified in-repo for the same reason."
n                 = 8
m                 = 8
is_permutation    = false
algebraic_form    = "x^3 + a^85 * Tr_1^8(x) * Tr_2^8(x) in GF(2^8), modulus x^8 + x^4 + x^3 + x^2 + 1 (=285), a = generator (x)"
bib_key = "Taniguchi_202501"

schema_version = 1

# --- Gold (i = 1, 3) — only two distinct classes up to CCZ for n=8 ----------

[[apn_functions]]
name              = "n8_Gold_x3"
description       = "Gold APN x^3 over GF(2^8) with Rijndael modulus. Not a permutation (gcd(3, 255) = 3)."
n                 = 8
m                 = 8
is_permutation    = false
algebraic_form    = "x^3 in GF(2^8), modulus x^8 + x^4 + x^3 + x + 1"
bib_key = "Gold_196801"
source            = "Gold, IEEE Trans. Inf. Theory 1968; APN per Nyberg EUROCRYPT 1994."
monomial_exponent = 3

[[apn_functions]]
name              = "n8_Gold_x9"
description       = "Gold APN x^9 over GF(2^8) (i = 3). Not a permutation."
n                 = 8
m                 = 8
is_permutation    = false
algebraic_form    = "x^9 in GF(2^8), modulus x^8 + x^4 + x^3 + x + 1"
bib_key = "Gold_196801"
source            = "Gold, IEEE Trans. Inf. Theory 1968."
monomial_exponent = 9

# --- Kasami (i = 3) ---------------------------------------------------------

[[apn_functions]]
name              = "n8_Kasami_x57"
description       = "Kasami APN x^57 = x^(2^6 - 2^3 + 1) over GF(2^8). Not a permutation."
n                 = 8
m                 = 8
is_permutation    = false
algebraic_form    = "x^57 in GF(2^8), modulus x^8 + x^4 + x^3 + x + 1"
bib_key = "Nyberg_199400"
source            = "Nyberg, EUROCRYPT 1994; Kasami exponent family."
monomial_exponent = 57

# --- Calderini-Budaghyan-Carlet (2021) Theorem 6.2 — new quadratic APN class -

[[apn_functions]]
name              = "n8_Calderini2021_thm62"
description       = "Theorem 6.2 (Calderini-Budaghyan-Carlet 2021) quadratic APN over GF(2^4) x GF(2^4) ~ GF(2^8), parameters m=4, i=1, b=1, c=6 (GF(2^4) modulus x^4+x+1 = 19). Not a permutation. Outside known classes: ortho-derivative differential spectrum (7 distinct values) distinct from n8_Gold_x3, n8_Gold_x9 (3 distinct values each) and n8_Kasami_x57 (degree 4)."
n                 = 8
m                 = 8
is_permutation    = false
algebraic_form    = "Bivariate F(x,y) = (xy, x^{2^i+1} + x^{2^{i+m/2}}*y^{2^{m/2}} + b*xy^{2^i} + c*y^{2^i+1}) over GF(2^4), m=4, i=1, b=1, c=6, modulus x^4+x+1 (=19); packed z=x|(y<<4) -> (xy)|(G<<4)"

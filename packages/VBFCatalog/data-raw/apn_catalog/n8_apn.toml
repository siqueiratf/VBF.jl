source            = "Taniguchi, Polujan, Pott, Arshad (2025), Example 4.2 (arXiv:2501.03922). LUT reproduced from packages/VBFRepro/src/202501-taniguchi-affine-subspaces/example4_2.jl (example4_2_report): F(x) = x^3 over modulus 285 with constants a = [0, 0, a^85*b, a^85*b^2], b = a^85, added on the cosets {x : Tr_2^8(x) = c} for c in {0, 1, b, b^2}; the coset construction and the closed form x^3 + a^85*Tr(x)*Tr_2^8(x) were checked to agree pointwise."

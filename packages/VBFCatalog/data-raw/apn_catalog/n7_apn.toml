# --- Budaghyan-Carlet-Leander (2009) non-power quadratic APN -----------------

[[apn_functions]]
name              = "n7_Budaghyan2009_x3_tr_x9"
description       = "Budaghyan-Carlet-Leander (2009) quadratic APN x^3 + Tr(x^9), the first infinite family of APN functions CCZ-inequivalent to power mappings. Not a permutation. Re-verified APN (differential uniformity 2) and CCZ-inequivalent to every n=7 power map in this file via Gamma-rank (4026) and Delta-rank (212); the power maps have Delta-rank 198 (Gold), 338 (Kasami x13/Welch), 436 (Kasami x57/Niho), or 4928 (Inverse) — all distinct."
n                 = 7
m                 = 7
is_permutation    = false
algebraic_form    = "x^3 + Tr(x^9) in GF(2^7), Tr the absolute trace GF(2^7)->F_2, modulus x^7 + x + 1"
bib_key = "Budaghyan_200904"
source            = "Budaghyan, Carlet, Leander, 'Constructing new APN functions from known ones', Finite Fields Appl. 15 (2009), Corollary 1 / Corollary 4."

# --- Welch ------------------------------------------------------------------

[[apn_functions]]
name              = "n7_Welch_x11"
description       = "Welch APN x^11 = x^(2^3 + 3) over GF(2^7). Per the Welch conjecture (proved by Canteaut/Charpin/Dobbertin 2000)."
n                 = 7
m                 = 7
is_permutation    = true
algebraic_form    = "x^11 in GF(2^7), modulus x^7 + x + 1"
bib_key = "Nyberg_199400"
source            = "Welch exponent x^(2^t + 3) for n = 2t+1. APN-ness for n=7 confirmed numerically; full proof by Canteaut-Charpin-Dobbertin (2000)."
monomial_exponent = 11

# --- Niho -------------------------------------------------------------------

[[apn_functions]]
name              = "n7_Niho_x39"
description       = "Niho APN x^39 = x^(2^3 + 2^5 - 1) over GF(2^7). For n=2t+1 with t=3 odd, the Niho exponent is 2^t + 2^((3t+1)/2) - 1."
n                 = 7
m                 = 7
is_permutation    = true
algebraic_form    = "x^39 in GF(2^7), modulus x^7 + x + 1"
bib_key = "Nyberg_199400"
source            = "Niho exponent (1972 thesis); APN-ness per Hollmann-Xiang / Dobbertin."
monomial_exponent = 39

# --- Inverse ----------------------------------------------------------------

[[apn_functions]]
name              = "n7_Inverse_x126"
description       = "Inverse function x^126 = x^(2^7 - 2) over GF(2^7). For odd n, the field inverse is APN."
n                 = 7
m                 = 7
is_permutation    = true
algebraic_form    = "x^126 in GF(2^7), modulus x^7 + x + 1"
bib_key = "Nyberg_199400"
source            = "Nyberg, EUROCRYPT 1994 — inverse function is APN for odd n."
monomial_exponent = 126

# Standalone environment for the dev-time catalog importers (NOT a workspace
# member: a workspace shares one manifest, which would drag these build-only,
# heavy deps — Parquet2 et al. — back into the VBF/VBFCatalog runtime resolve
# and into CI precompilation). `[sources]` resolves the two unregistered
# packages by path, so the importers run with `--project=data-build` without
# joining the workspace.
[deps]
DBInterface = "a10d1c49-ce27-4219-8d33-6db1a4562965"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
JSON3 = "0f8b85d8-7281-11e9-16c2-39a750bddbf1"
Parquet2 = "98572fba-bba0-415d-956f-fa77e587d26d"
SQLite = "0aa819cd-b072-5ff4-a722-6bc24af294d9"
Tables = "bd369af6-aec1-5ad0-b16a-f7cc5008161c"
VBF = "569852b5-053e-4203-a2e2-8ddd9b8bc7af"
VBFCatalog = "806e9246-bd0c-40c6-b7ea-7b2eabc2fba0"

[sources]
VBF = { path = "../../VBF" }
VBFCatalog = { path = ".." }

[compat]
DBInterface = "2"
JSON3 = "1.14"
Parquet2 = "0.2.33"
SQLite = "1.6"
Tables = "1.12.1"
julia = "1.12"

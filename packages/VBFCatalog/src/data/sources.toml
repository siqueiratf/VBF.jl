[build]
max_n = 11

[build.functions]
"APN" = 35
"APN-rep" = 529
"CCZ-rep-GF4" = 27
"Literature" = 18
"known-family" = 69
"known-sporadic" = 4

[[source]]
cache_name = "sboxU"
check_kind = "dir"
check_path = "sboxU/scripts/apnDB"
converter = "convert_apn_reps.jl"
env_var = "BFA_SBOXU_PATH"
files = ["reprs6.py", "reprs7.py", "reprs8.py", "eightBitAPN.py"]
label = "APN reps"
name = "apn_reps"
required = true
revision = "7066b825c979ceefa901e7be3b2afcc63f587bcf"
upstream = "https://github.com/lpp-crypto/sboxU.git"

[[source]]
cache_name = "sboxU"
check_kind = "dir"
check_path = "sboxU/scripts/apnDB"
converter = "convert_quadratic_apn_8bit.jl"
env_var = "BFA_SBOXU_PATH"
files = ["eightBitAPN.py", "firstQAM.py", "BeierleLeander.py", "apn_8bit_BLP22.py", "secondQAM.py"]
label = "quadratic APN 8-bit corpora"
name = "quadratic_apn_8bit"
revision = "7066b825c979ceefa901e7be3b2afcc63f587bcf"
upstream = "https://github.com/lpp-crypto/sboxU.git"

[[source]]
cache_name = "beierle2025"
check_kind = "file"
check_path = "new_apns.txt"
converter = "convert_beierle2025.jl"
download = "https://langevin.univ-tln.fr/data/apns/new_apns.txt.gz"
env_var = "BFA_BEIERLE2025_PATH"
label = "Beierle et al. 2025 (Zenodo 16752428, 3.4 GB)"
name = "beierle2025"
published_bytes = 3395265744
published_md5 = "dd6ae0655ba8a299a3d668cfc6cf10bf"
required = true
reuse_corpus = "beierle2025_n8"
sha256 = "580b7143af95e24995845266e765f29d59d7a507116fc86889f51d5d1a7461f8"

[[source]]
cache_name = "thesis"
check_kind = "file"
check_path = "rep1.txt"
converter = "convert_simonberg.jl"
env_var = "BFA_THESIS_PATH"
files = ["rep1.txt", "rep2.txt", "rep3.txt", "rep4.txt", "rep5.txt", "rep6.txt", "rep7.txt", "rep8.txt", "rep9.txt", "rep10.txt", "rep11.txt", "rep12.txt", "rep13.txt", "rep14.txt", "rep15.txt", "rep16.txt", "rep17.txt", "rep18.txt", "rep19.txt", "rep20.txt", "rep21.txt", "rep22.txt", "rep23.txt", "rep24.txt", "rep25.txt", "rep26.txt", "rep27.txt"]
label = "Simon-Berg thesis"
name = "simonberg"
required = true
revision = "c13952d2458cb692171816b483f4e8ac0c62455a"
upstream = "https://github.com/Simon-Berg/thesis.git"

[[source]]
check_kind = "file"
check_path = "apn_all.json"
converter = "convert_kuznetsov2026.jl"
enabled = false
env_var = "BFA_KUZNETSOV2026_PATH"
label = "Kuznetsov 2026 original JSON dataset"
name = "kuznetsov2026"

[[source]]
args = ["--max-n", "11"]
builtin = true
converter = "convert_known_families.jl"
label = "known APN families (constructed)"
name = "known_families"
required = true

[[source]]
builtin = true
converter = "convert_sporadic_known.jl"
label = "known sporadic APN classes (constructed)"
name = "known_sporadic"
required = true

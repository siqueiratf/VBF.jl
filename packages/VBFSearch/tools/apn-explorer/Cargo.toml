[package]
name = "apn-explorer"
version = "0.1.0"
edition = "2021"
description = "Analyses of the class explorer data: invariant heatmaps, parent-to-child transitions, distributions, generations and communities (Louvain, Leiden)."

[dependencies]
rayon = "1.10"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

# n = 8 APN functions (monomial entries).
#
# n = 8 is the cryptographically important case (every byte-oriented
# block cipher S-box). 2^8 - 1 = 255 = 3 · 5 · 17, so most low-degree
# Gold/Kasami exponents share a factor with 255 and are NOT
# permutations.
#
# Note in particular: the field inverse x^(2^8 - 2) = x^254 is *not*
# APN — its differential uniformity is 4 (the famous "almost APN"
# result, Daemen-Rijmen's justification for using it in AES). It is
# therefore absent from this file.
#
# Modulus: x^8 + x^4 + x^3 + x + 1  (FIPS 197 / Rijndael, = 283).

schema_version = 1

# --- Gold (i = 1, 3) — only two distinct classes up to CCZ for n=8 ----------

[[apn_functions]]
name              = "n8_Gold_x3"
description       = "Gold APN x^3 over GF(2^8) with Rijndael modulus. Not a permutation (gcd(3, 255) = 3)."
n                 = 8
m                 = 8
is_permutation    = false
algebraic_form    = "x^3 in GF(2^8), modulus x^8 + x^4 + x^3 + x + 1"
bib_key           = "Gold1968"
source            = "Gold, IEEE Trans. Inf. Theory 1968; APN per Nyberg EUROCRYPT 1994."
monomial_exponent = 3

[[apn_functions]]
name              = "n8_Gold_x9"
description       = "Gold APN x^9 over GF(2^8) (i = 3). Not a permutation."
n                 = 8
m                 = 8
is_permutation    = false
algebraic_form    = "x^9 in GF(2^8), modulus x^8 + x^4 + x^3 + x + 1"
bib_key           = "Gold1968"
source            = "Gold, IEEE Trans. Inf. Theory 1968."
monomial_exponent = 9

# --- Kasami (i = 3) ---------------------------------------------------------

[[apn_functions]]
name              = "n8_Kasami_x57"
description       = "Kasami APN x^57 = x^(2^6 - 2^3 + 1) over GF(2^8). Not a permutation."
n                 = 8
m                 = 8
is_permutation    = false
algebraic_form    = "x^57 in GF(2^8), modulus x^8 + x^4 + x^3 + x + 1"
bib_key           = "Nyberg1994"
source            = "Nyberg, EUROCRYPT 1994; Kasami exponent family."
monomial_exponent = 57

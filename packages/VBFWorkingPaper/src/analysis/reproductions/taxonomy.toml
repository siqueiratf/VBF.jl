# ── the invariants that metric C1 compares ──────────────────────────────────
#
# `call` names the function of packages/VBF or packages/VBFCatalog that the
# script applies. `max_n` refuses a dimension above the guard of the source.
# `parity` restricts the invariant to even or odd n when the invariant needs it.
# `bench_case` names the row of data/perf/archive/generated/benchmarks.csv that gives the
# cost, so the cost column comes from the benchmark suite and not from a second
# measurement.

[[invariant]]
name = "sigma_signature"
call = "sigma_hash"
max_n = 13
bench_case = "catalog/sigma_hash"
note = "the ortho-derivative signature; a mismatch certifies CCZ-inequivalence"

[[invariant]]
name = "od_differential_spectrum"
call = "od_diff"
max_n = 13
bench_case = "invariants/ortho_derivative"
note = "the differential spectrum of the ortho-derivative alone, one half of sigma"

[[invariant]]
name = "od_walsh_spectrum"
call = "od_walsh"
max_n = 13
bench_case = "invariants/ortho_derivative"
note = "the absolute Walsh spectrum of the ortho-derivative alone, the other half"

[[invariant]]
name = "apn_ea_mugshot"
call = "apn_ea_mugshot"
max_n = 12
bench_case = "invariants/apn_ea_mugshot"
note = "necessary and not sufficient for EA-equivalence; matching tuples do not prove equivalence"

[[invariant]]
name = "pi_multiset"
call = "pi_multiset"
max_n = 12
bench_case = "invariants/pi_multiset"
note = "the shifted derivative histogram"

[[invariant]]
name = "component_degree_spectrum"
call = "component_degree_spectrum"
max_n = 14
bench_case = "invariants/component_degree_spectrum"
note = "the degrees of the components"

[[invariant]]
name = "differential_spectrum"
call = "differential_spectrum"
max_n = 14
bench_case = "spectra/differential_spectrum"
note = "the differential spectrum of F itself; the same for every APN function"

[[invariant]]
name = "absolute_walsh_spectrum"
call = "absolute_walsh_spectrum"
max_n = 12
bench_case = "spectra/absolute_walsh_spectrum"
note = "the extended Walsh spectrum of F itself"

[[invariant]]
name = "gamma_rank"
call = "gamma_rank"
max_n = 7
bench_case = "invariants/gamma_rank"
note = "the source guard refuses n > 7"

[[invariant]]
name = "delta_rank"
call = "delta_rank"
max_n = 7
bench_case = "invariants/delta_rank"
note = "the source guard refuses n > 7"


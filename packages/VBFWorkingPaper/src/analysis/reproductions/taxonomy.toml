# analysis/taxonomy.toml — the classification that the metrics need.
#
# `analysis/metrics.jl` reads this file. It holds the two things that no file in
# the repository states in a machine-readable form:
#
#   1. the subject of known reproduced papers (`topic`);
#   2. which construction method group each catalog object belongs to.
#
# Construction categories are editorial metadata for this working paper.
#
# Catalog method and corpus categories require explicit classification.
# Paper discovery is dynamic and does not depend on this list.

[meta]
schema_version = 1
source_of_group_codes = "Working-paper construction taxonomy"

# ── the topic of a paper ────────────────────────────────────────────────────
#
# `topic` answers "what kind of result does this paper report?". It is the row
# paper inventory classification. New papers remain explicitly unclassified.
#
#   construction   an infinite family, a polynomial or a structural construction
#   modification   a change to a known function: switching, isotopic shift,
#                  a trim, a change on a subspace, a change at some points
#   search         instances found by a computer search
#   classification an exhaustive classification inside a bounded region
#   equivalence    a method to decide or to test equivalence
#   four_uniform   differentially 4-uniform permutations, not APN functions
#   theory         a bound, a distance, a non-existence result, a relation
#                  between known constructions
#
# Publication identity is stored in VBFRepro/publications.toml.
# Function entries and counts are always read from VBFCatalog.
# `topic_basis` names the evidence for the topic. It is the title of the paper
# unless a note says otherwise.


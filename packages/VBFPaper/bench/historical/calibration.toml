# ── Audit re-verification, 2026-08-17 ───────────────────────────────────────
# The file above was generated 2026-08-16 and is 1 day old, i.e. well inside the
# 30-day refresh window, so it was NOT regenerated. It was instead spot-checked
# against a fresh run on the same machine so that the report's cost models rest
# on a figure that was re-measured, not merely inherited.
[audit_spotcheck_20260817]
checked_utc        = "2026-08-17T16:40:00Z"
julia_version      = "1.12.6"
method             = "min of N repetitions after warm-up, same as the generator, but on a CONTENDED machine"
is_apn_n8          = 3.8251e-05   # vs 3.5878e-05 above -> 1.07x
is_apn_n10         = 9.84686e-04  # vs 5.53958e-04 above -> 1.78x
ortho_derivative_n8 = 3.18137e-04 # vs 1.53919e-04 above -> 2.07x
verdict = """
Every re-measured figure agrees with the stored one to within 1.1x-2.1x. The
spread is machine contention, not drift: the cheapest measurement (is_apn_n8)
reproduces to 7%, and the spread grows with the per-call cost, which is the
signature of scheduler pressure rather than of a changed implementation.

CONSEQUENCE FOR THE REPORT: every core-hour figure derived from this file
carries a +/- 2x uncertainty band on a loaded machine. Estimates are quoted as
single numbers for readability; read them as within a factor of two. This is
retained as a limitation of this historical measurement; no cost figure in the
report is given to more than two significant digits.
"""

# Independently re-verified this session, not timed:
#   ord(2) under primitive_polynomial(8) = 51, NOT 255 (see audit finding F008).
#   ord(2) under conway_polynomial(8)    = 255.
# This matters for every alpha^i index at n=8 and is why several papers pin
# conway_polynomial(8) explicitly.
[audit_spotcheck_20260817.field_facts]

# VBFPaper/doc/performance/crossings.toml — the metadata that packages/VBFPaper/src/analysis/performance/crossings.jl needs.
#
# The retired custom-timer suite wrote the historical benchmarks.csv. That file holds
# measurements only. A measurement becomes a result when it meets a prediction
# that it can contradict. This file holds those predictions, and it holds the
# facts about a case that the CSV cannot carry.
#
# Three crossings read this file.
#
#   1. n x case against the theoretical exponent   -> the growth table
#   2. outcome polarity x equivalence relation     -> the polarity table
#   3. time x allocated bytes                      -> the memory table
#
# CAUTION: the `n` column of the CSV holds three different quantities. For
# `spectra/ddt` it is a bit width and the cost model is exponential. For
# `linalg/gauss_jordan` it is a matrix dimension and the cost model is a power
# law. For `linalg/parity` it is a machine word width and the workload is
# fixed. A fit that mixes them returns a meaningless slope. The `size_kind`
# section below separates them, and the script refuses to fit a case that it
# cannot classify.

[meta]
schema_version = 1
source_csv     = "packages/VBFPaper/bench/data/archive/generated/benchmarks.csv"
source_meta    = "packages/VBFPaper/bench/data/archive/generated/benchmarks_meta.tex"
note           = "Edit this file, then run `make -C packages/VBFPaper crossings`."

# ── the fit ──────────────────────────────────────────────────────────────────

[fit]
# A series needs at least this many points before the script fits it.
min_points = 3

# The verdict band, in bits of slope per unit of n. The script prints the
# signed deviation as well, so a reader can apply a different band.
tolerance_bits = 0.35

# A series that the straight line misses by more than this many bits is curved.
# The slope of such a fit is an average over two regimes and not one exponent,
# so the verdict says "curved fit" and the reader must read the pair-slope
# columns of the CSV.
max_residual_bits = 0.5

# A series whose fastest point is below this time cannot support a growth
# claim. The fixed cost of one call is then a large part of the measurement,
# and the fitted slope reads low. The script marks such a series
# "inconclusive" and keeps it in the table with that label.
overhead_floor_seconds = 1.0e-6

# The two ceilings that the reachability columns use. The first is one hour of
# one core. The second is the memory caution that packages/VBFPaper/bench/data/archive/bench/README.md states for
# level 3.
time_ceiling_seconds = 3600.0
memory_ceiling_bytes = 4294967296     # 4 GiB

# How far past the largest measured n the reachability columns may go. A fit
# over n = 8 to 12 says nothing about n = 32. When the ceiling sits beyond this
# distance, the script prints a bound such as ">20" and not a number.
max_extrapolation_n = 8

# ── what `n` means ───────────────────────────────────────────────────────────
#
# bit_width   n is the width of the S-box. The cost model is exponential in n.
# vector_len  n is the log2 of the length of a raw vector. Exponential in n.
# matrix_dim  n is the side of a square matrix over GF(2), one row per word.
#             The cost model is a power law in n.
# fixed       the workload does not follow n. The script does not fit it.
# none        the case carries n = 0.

[size_kind.defaults]
representations = "bit_width"
linalg          = "matrix_dim"
spectra         = "bit_width"
invariants      = "bit_width"
equivalence     = "bit_width"
constructions   = "bit_width"
catalog         = "bit_width"

[size_kind.overrides]
# linalg cases whose n is a bit width, not a matrix side.
"linalg/compose_sbox_linear"      = "bit_width"
"linalg/expand_subspaces"         = "bit_width"
"linalg/extract_linear_subspaces" = "bit_width"
"linalg/find_2d_subspaces"        = "bit_width"
"linalg/smallest_basis"           = "bit_width"
"linalg/span_from_basis"          = "bit_width"
"linalg/subspace_count_signature" = "bit_width"
# linalg cases with a fixed workload; n is the width of the machine word.
"linalg/f2_dot"    = "fixed"
"linalg/is_in_span" = "fixed"
"linalg/parity"    = "fixed"
# spectra cases that take a raw vector of 2^n numbers, not an S-box.
"spectra/spectrum_build"      = "vector_len"
"spectra/spectrum_read"       = "vector_len"
"spectra/walsh_hadamard!"     = "vector_len"
"spectra/walsh_hadamard_alloc" = "vector_len"
"spectra/walsh_transform"     = "vector_len"
# The anomaly framework uses arbitrary-precision arithmetic. Its cost follows
# the precision and the value range, not the width of the S-box. The comment at
# the head of packages/VBFPaper/bench/data/archive/bench/suites/03_spectra.jl states this.
"spectra/ddt_coeff_probability" = "fixed"
"spectra/expected_boomerang_uniformity_distribution" = "fixed"
"spectra/expected_differential_uniformity_distribution" = "fixed"
"spectra/expected_linearity_distribution" = "fixed"
"spectra/expected_max_distribution" = "fixed"
"spectra/table_anomaly_random"  = "fixed"
"spectra/table_negative_anomaly" = "fixed"

# ── crossing 1: the predicted exponent of each growth series ─────────────────
#
# `predicted_slope` is the exponent c in the model  time ~ 2^(c*n)  for an
# exponential series, or the exponent c in  time ~ n^c  for a power law.
#
# `kind` is "exact" when the model states the whole cost, and "lower_bound"
# when each unit of work itself grows with n. A measured slope above a lower
# bound agrees with the model; a measured slope below it does not.
#
# `basis` states where the exponent comes from. `source` names the file that
# documents it.

[[growth]]
case = "spectra/ddt"
predicted_slope = 2.0
kind   = "exact"
basis  = "the table holds 2^{2n} cells and every cell is written once"
source = "packages/VBFPaper/bench/data/archive/bench/suites/03_spectra.jl"

[[growth]]
case = "spectra/lat"
predicted_slope = 2.0
kind   = "lower_bound"
basis  = "2^n fast Walsh-Hadamard transforms, each of n*2^n butterflies"
source = "packages/VBFPaper/bench/data/archive/bench/suites/03_spectra.jl"

[[growth]]
case = "invariants/ortho_derivative"
predicted_slope = 2.0
kind   = "exact"
basis  = "2^n derivative directions, each scanned over 2^n inputs"
source = "packages/VBFPaper/bench/data/archive/bench/suites/04_invariants.jl"

[[growth]]
case = "invariants/sigma_multiplicities"
predicted_slope = 2.0
kind   = "lower_bound"
basis  = "the Walsh spectrum of 2^{2n} cells, then a fourth power moment"
source = "packages/VBFPaper/bench/data/archive/bench/suites/04_invariants.jl"

[[growth]]
case = "invariants/gamma_rank"
predicted_slope = 6.0
kind   = "exact"
basis  = "elimination on a 2^{2n} x 2^{2n} matrix, 64 columns to a word: 2^{6n}/64"
source = "packages/VBF/src/invariants/design_ranks.jl"

[[growth]]
case = "linalg/extract_linear_subspaces"
predicted_slope = 1.0
kind   = "exact"
basis  = "pairs drawn from a span of 2^{n/2} elements: 2^n pairs"
source = "packages/VBFPaper/bench/data/archive/bench/suites/02_linalg.jl"

[[growth]]
case = "linalg/gauss_jordan"
predicted_slope = 2.0
kind   = "exact"
basis  = "n rows against n pivots, one machine word to a row"
source = "packages/VBFPaper/bench/data/archive/bench/suites/02_linalg.jl"

[[growth]]
case = "representations/anf"
predicted_slope = 1.0
kind   = "lower_bound"
basis  = "the Mobius transform runs n*2^n butterflies"
source = "packages/VBFPaper/bench/data/archive/bench/suites/01_representations.jl"

[[growth]]
case = "representations/mobius"
predicted_slope = 1.0
kind   = "lower_bound"
basis  = "the Mobius transform runs n*2^n butterflies"
source = "packages/VBFPaper/bench/data/archive/bench/suites/01_representations.jl"

[[growth]]
case = "representations/is_permutation"
predicted_slope = 1.0
kind   = "exact"
basis  = "one pass over 2^n table entries"
source = "packages/VBFPaper/bench/data/archive/bench/suites/01_representations.jl"

[[growth]]
case = "representations/compositional_inverse"
predicted_slope = 1.0
kind   = "exact"
basis  = "one pass over 2^n table entries"
source = "packages/VBFPaper/bench/data/archive/bench/suites/01_representations.jl"

[[growth]]
case = "representations/sbox_construct"
predicted_slope = 1.0
kind   = "exact"
basis  = "a copy of 2^n words"
source = "packages/VBFPaper/bench/data/archive/bench/suites/01_representations.jl"

[[growth]]
case = "representations/gf_monomial_lut"
predicted_slope = 1.0
kind   = "lower_bound"
basis  = "2^n table entries, each one field multiplication chain"
source = "packages/VBFPaper/bench/data/archive/bench/suites/01_representations.jl"

[[growth]]
case = "representations/gf_mul_sweep"
predicted_slope = 0.0
kind   = "lower_bound"
basis  = "4096 products; the count is fixed and only the modulus follows n"
source = "packages/VBFPaper/bench/data/archive/bench/suites/01_representations.jl"

[[growth]]
case = "representations/gf_inv_sweep"
predicted_slope = 0.0
kind   = "lower_bound"
basis  = "1024 inverses; the count is fixed but one inverse costs O(n^2) bit steps"
source = "packages/VBFPaper/bench/data/archive/bench/suites/01_representations.jl"

[[growth]]
case = "constructions/gold_apn"
predicted_slope = 1.0
kind   = "exact"
basis  = "2^n table entries, each one cube in the field"
source = "packages/VBFPaper/bench/data/archive/bench/suites/06_constructions.jl"
caveat = "the sweep crosses the UInt8 to UInt16 storage boundary between n = 8 and n = 9"

[[growth]]
case = "constructions/kasami_apn"
predicted_slope = 1.0
kind   = "lower_bound"
basis  = "2^n table entries, each one exponentiation to 2^{2k}-2^k+1"
source = "packages/VBFPaper/bench/data/archive/bench/suites/06_constructions.jl"
caveat = "the sweep crosses the UInt8 to UInt16 storage boundary between n = 8 and n = 9"

[[growth]]
case = "constructions/inverse_apn"
predicted_slope = 1.0
kind   = "lower_bound"
basis  = "2^n table entries, each one exponentiation to 2^n-2, which costs O(n) products"
source = "packages/VBFPaper/bench/data/archive/bench/suites/06_constructions.jl"
caveat = "the sweep crosses the UInt8 to UInt16 storage boundary between n = 8 and n = 9"

[[growth]]
case = "constructions/niho_apn"
predicted_slope = 1.0
kind   = "lower_bound"
basis  = "2^n table entries, each one exponentiation with an n-bit exponent"
source = "packages/VBFPaper/bench/data/archive/bench/suites/06_constructions.jl"
caveat = "the sweep crosses the UInt8 to UInt16 storage boundary between n = 8 and n = 9"

[[growth]]
case = "constructions/welch_apn"
predicted_slope = 1.0
kind   = "lower_bound"
basis  = "2^n table entries, each one exponentiation to 2^t+3"
source = "packages/VBFPaper/bench/data/archive/bench/suites/06_constructions.jl"
caveat = "the sweep crosses the UInt8 to UInt16 storage boundary between n = 8 and n = 9"

# ── crossing 1: series that the script must NOT fit ──────────────────────────
#
# A series belongs here when its points do not measure one algorithm on one
# family of inputs. A fit over such a series returns a number that looks like a
# growth rate and is not one.

[[excluded]]
case   = "invariants/apn_ea_mugshot"
reason = """
The payload changes class inside the sweep. n = 5 uses Kasami x^13 and n = 6 \
uses the Dillon permutation, and both take the fallback path. n = 8, 10 and 12 \
use Gold x^3, which takes the quadratic path. The two paths are different \
algorithms, so the five points do not form one series. A fit over all five \
returns 0.11 bits per n, which is below every path in the code."""

[polarity_rules]
# A pair whose two sides are inside this factor of each other counts as
# "balanced". Outside it, the script names the faster answer.
balanced_band = 1.5

# ── crossing 2: the polarity pairs ───────────────────────────────────────────
#
# Every decision procedure in packages/VBFPaper/bench/data/archive/bench/suites/05_equivalence.jl registers a
# positive case and a negative case, because the two answers take different
# code paths. This section pairs them. The script reads the time and the
# allocation of each side and reports the ratio.
#
# `expectation` states which side the code should favour, and why. The script
# prints the measured direction next to it. A pair whose direction contradicts
# the expectation is the interesting row.

[[polarity]]
relation = "linear"
n = 5
positive = "equivalence/are_linear_equivalent_pos"
negative = "equivalence/are_linear_equivalent_neg"
expectation = "balanced"
mechanism = """
Both sides walk the guessed-basis tree. The positive side stops at the first \
witness; the negative side must empty the tree. At n = 5 the tree is small, so \
neither side dominates."""

[[polarity]]
relation = "affine"
n = 5
positive = "equivalence/are_affine_equivalent_pos"
negative = "equivalence/are_affine_equivalent_neg"
expectation = "negative_slower"
mechanism = """
The affine test repeats the linear test once for each shift anchor. The \
positive side stops at the anchor that works. The negative side must reject \
every anchor, and the suite note for the negative case says "all anchors"."""

[[polarity]]
relation = "EA"
n = 8
positive = "equivalence/are_ea_equivalent_pos"
negative = "equivalence/are_ea_equivalent_neg"
expectation = "negative_faster"
mechanism = """
The negative pair is Gold x^3 against Gold x^9. A cheap ortho-derivative \
invariant separates them, so the decision returns before any search starts. \
The positive pair must produce a witness, which needs the full search."""

[[polarity]]
relation = "CCZ"
n = 6
positive = "equivalence/are_ccz_equivalent_pos"
negative = "equivalence/are_ccz_equivalent_neg"
expectation = "negative_faster"
mechanism = """
The negative pair is the Dillon permutation against a random permutation. An \
invariant rejects it at once. The positive pair, Kim against Dillon, needs the \
EA representatives of the whole CCZ class."""

[[polarity]]
relation = "EA, exact decision"
n = 7
positive = "equivalence/ea_mappings_from_ortho_derivative_pos"
negative = "equivalence/ea_mappings_from_ortho_derivative_neg"
expectation = "balanced"
mechanism = """
This routine returns every EA mapping, so it cannot stop early on either side. \
The two sides do the same work, and the positive side pays extra only to \
collect the mappings that it finds."""

# ── crossing 1: external checks of an extrapolation ──────────────────────────
#
# A fit earns trust when it predicts a point that another instrument measured.
# Each entry gives such a point. The script fits the suite series, extrapolates
# to `n`, and prints the ratio against `measured_seconds`.

[[extrapolation_check]]
case = "invariants/gamma_rank"
n = 8
measured_seconds = 166.8
source = "packages/VBFPaper/bench/data/archive/bench/calibration.toml [design_rank_gamma] n8_seconds"
note = """
The suite stops at n = 7, because packages/VBF/src/invariants/design_ranks.jl \
refuses n > 7. The calibration file measured n = 8 with the same bit-packed \
elimination from an out-of-source copy, and reports 166.8 s and 0.95 GB of \
peak resident memory. The n = 5 and n = 6 entries of that same calibration \
section disagree with the suite by two orders of magnitude and are not used \
here; they carry the compilation of the first call."""

# ── crossing 3: the memory table ─────────────────────────────────────────────

[memory]
# How many of the heaviest cases the LaTeX table prints. The CSV holds all.
table_rows = 15

# A case above this share of the allocation of the machine gets a mark in the
# table. The script reads the size of the memory from benchmarks_meta.tex.
mark_fraction_of_machine = 0.02

# CAUTION: the `bytes` column of the CSV comes from `@allocated`. It is the
# total that one call allocates, and it is NOT the peak resident memory. A
# routine that allocates 2 GB in small pieces can run inside a much smaller
# resident set, because the collector frees the early pieces. Two figures for
# peak resident memory exist in this repository and both come from another
# instrument: 0.95 GB for the Gamma-rank at n = 8, in
# packages/VBFPaper/bench/data/archive/bench/calibration.toml, and about 1.7 GB for one call of
# equivalence/partition_automorphisms at n = 6, in packages/VBFPaper/bench/data/archive/bench/README.md.
peak_rss_is_measured_elsewhere = true

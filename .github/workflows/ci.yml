name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  paper-tests:
    name: Paper • ${{ matrix.paper }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        paper:
          - 2003/Biryukov_200300
          - 2005/Budaghyan_200506
          - 2008/Bracken_200807
          - 2008/Brinkmann_200812
          - 2009/Budaghyan_200904
          - 2009/Budaghyan_200910
          - 2009/Edel_200900
          - 2011/Bracken_201103
          - 2012/Bracken_201205
          - 2013/Yuyin_201300
          - 2014/Li_201408
          - 2014/Zha_201401
          - 2015/Tang_201510
          - 2019/Canteaut_201906
          - 2019/Kaleyski_201911
          - 2019/Taniguchi_201909
          - 2020/Budaghyan_202008
          - 2020/Budaghyan_202009
          - 2020/Budaghyan_202011
          - 2020/Calderini_202009
          - 2020/Kalgin_202000
          - 2020/Yu_202012
          - 2021/Beierle_202107
          - 2021/Budaghyan_202101
          - 2021/Calderini_202100
          - 2021/Chase_202110
          - 2022/Beierle_202201
          - 2022/Canteaut_202205
          - 2022/Gologlu_202207
          - 2022/Kaleyski_202200
          - 2022/Kaleyski_202203
          - 2022/Li_202207
          - 2022/Yu_202211d
          - 2022/Zheng_202211
          - 2023/Calderini_202306
          - 2024/Ichanska_202400
          - 2024/Li_202402
          - 2025/Beierle_202508
          - 2025/Taniguchi_202501
          - 2025/Yu_202512
          - 2026/Kuznetsov_202606
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      - name: Run paper tests
        run: make -C papers/${{ matrix.paper }} test

  catalog-check:
    # Structural half of .githooks/catalog-check — the same gate the pre-commit
    # hook runs, as a backstop for clones that never enabled the hook. Needs no
    # Julia and finishes in seconds, so a data-raw change committed without its
    # rebuilt BFA_catalog.sqlite is named as such here instead of surfacing 40
    # minutes later as a bare count mismatch in catalog_queries_test.
    name: Catalog sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Check data-raw against the committed catalog
        run: .githooks/catalog-check --structure-only

  test:
    name: Test • Julia ${{ matrix.julia }} • ${{ matrix.os }}
    needs: [paper-tests, catalog-check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.12']
        os: [ubuntu-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia ${{ matrix.julia }}
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1
        with:
          project: packages/VBF

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        with:
          project: packages/VBF
        env:
          # Hosted runners are small; cap the worker count so the few heavy items (n=6 CCZ enumeration, affine equivalence) don't contend.
          RETESTITEMS_NWORKERS: '2'

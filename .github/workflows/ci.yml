name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  paper-tests:
    name: Paper • ${{ matrix.paper }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        paper:
          - 200300-biryukov-equivalence
          - 200506-budaghyan-apn-polynomials
          - 200807-bracken-apn-trinomials
          - 200812-brinkmann-small-apn-classification
          - 200904-budaghyan-trace-apns
          - 200910-budaghyan-apn-families
          - 200900-edel-switching
          - 201103-bracken-quadratic-apns
          - 201205-bracken-du4-permutations
          - 201300-yu-du4-permutations
          - 201408-li-du4-from-apn
          - 201401-zha-inverse-permutations
          - 201510-tang-inverse-bijections
          - 201906-canteaut-butterflies
          - 201911-kaleyski-two-point-changes
          - 201909-taniguchi-quadratic-apns
          - 202008-budaghyan-isotopic-shifts
          - 202009-budaghyan-apn-distance
          - 202011-budaghyan-quadrinomials
          - 202009-calderini-equivalence-classes
          - 202000-kalgin-seven-variable
          - 202012-yu-binary-coefficients
          - 202107-beierle-self-equivalence
          - 202101-budaghyan-generalized-shifts
          - 202100-calderini-construction-relations
          - 202110-chase-walsh-zero-spaces
          - 202201-beierle-quadratic-instances
          - 202205-canteaut-ea-equivalence
          - 202207-gologlu-biprojective-apns
          - 202200-kaleyski-zero-apn-monomials
          - 202203-kaleyski-ea-invariants
          - 202207-li-quadratic-families
          - 202211-yu-qam
          - 202211-zheng-relative-trace
          - 202306-calderini-bivariate-families
          - 202400-ichanska-qam-search
          - 202402-li-trivariate-families
          - 202503-gologlu-biprojective-equivalence
          - 202508-beierle-millions
          - 202501-taniguchi-affine-subspaces
          - 202512-yu-dimension-ten
          - 202606-kuznetsov-groebner-search
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      - name: Run paper tests
        run: |
          julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
          make -C packages/VBFRepro/src/${{ matrix.paper }} test

  perf-smoke:
    name: Performance tooling • ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [VBF, VBFCatalog, VBFSearch, VBFRepro, VBFWorkingPaper]
    env:
      JULIA_LOAD_PATH: '@:@stdlib'
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Cache Julia depot
        uses: julia-actions/cache@v2
      - name: Instantiate performance environment
        run: julia --startup-file=no --project=packages/${{ matrix.package }}/perf -e 'using Pkg; Pkg.instantiate()'
      - name: Check performance tooling
        run: julia --startup-file=no --project=packages/${{ matrix.package }}/perf packages/${{ matrix.package }}/perf/test.jl

  catalog-check:
    # Structural half of .githooks/catalog-check — the same gate the pre-commit
    # hook runs, as a backstop for clones that never enabled the hook. Needs no
    # Julia and finishes in seconds, so a data-raw change committed without its
    # rebuilt BFA_catalog.sqlite is named as such here instead of surfacing 40
    # minutes later as a bare count mismatch in catalog_queries_test.
    name: Catalog sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Check data-raw against the committed catalog
        run: .githooks/catalog-check --structure-only

  test:
    name: Test • ${{ matrix.package }} • Julia ${{ matrix.julia }} • ${{ matrix.os }}
    needs: [paper-tests, catalog-check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.12']
        os: [ubuntu-latest]
        package: [VBF, VBFCatalog, VBFSearch, VBFRepro, VBFWorkingPaper]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia ${{ matrix.julia }}
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1
        with:
          project: packages/${{ matrix.package }}

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        with:
          project: packages/${{ matrix.package }}
        env:
          # Hosted runners are small; cap the worker count so the few heavy items (n=6 CCZ enumeration, affine equivalence) don't contend.
          RETESTITEMS_NWORKERS: '2'

      - name: Check shared perf and proposal consumers
        if: matrix.package == 'VBFWorkingPaper'
        run: |
          julia --startup-file=no --project=packages/VBFWorkingPaper packages/VBF/perf/analysis/test.jl
          julia --startup-file=no --project=packages/VBFWorkingPaper packages/VBFRepro/test/proposals/test_catalog_proposals.jl

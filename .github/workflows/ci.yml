name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test • Julia ${{ matrix.julia }} • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.12']
        os: [ubuntu-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Julia ${{ matrix.julia }}
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      # The repo root is a `[workspace]` (no package); the testable member is
      # `packages/VBF`. `Pkg.test()` there builds the test environment from
      # `packages/VBF/test/Project.toml`, resolved against the shared workspace
      # manifest (regenerated fresh each run — manifests are not committed).
      - name: Build package
        uses: julia-actions/julia-buildpkg@v1
        with:
          project: packages/VBF

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        with:
          project: packages/VBF

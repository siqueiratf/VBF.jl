name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      create_record:
        description: 'Create the Zenodo record of the prebuilt catalog data (first publication only; permanent)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  paper-tests:
    name: Paper • ${{ matrix.paper }}
    runs-on: ubuntu-latest
    needs: catalog-check
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        paper:
          - 200300-biryukov-equivalence
          - 200506-budaghyan-apn-polynomials
          - 200807-bracken-apn-trinomials
          - 200812-brinkmann-small-apn-classification
          - 200904-budaghyan-trace-apns
          - 200910-budaghyan-apn-families
          - 200900-edel-switching
          - 201103-bracken-quadratic-apns
          - 201205-bracken-du4-permutations
          - 201300-yu-du4-permutations
          - 201408-li-du4-from-apn
          - 201401-zha-inverse-permutations
          - 201510-tang-inverse-bijections
          - 201906-canteaut-butterflies
          - 201911-kaleyski-two-point-changes
          - 201909-taniguchi-quadratic-apns
          - 202008-budaghyan-isotopic-shifts
          - 202009-budaghyan-apn-distance
          - 202011-budaghyan-quadrinomials
          - 202009-calderini-equivalence-classes
          - 202000-kalgin-seven-variable
          - 202012-yu-binary-coefficients
          - 202107-beierle-self-equivalence
          - 202101-budaghyan-generalized-shifts
          - 202100-calderini-construction-relations
          - 202110-chase-walsh-zero-spaces
          - 202201-beierle-quadratic-instances
          - 202205-canteaut-ea-equivalence
          - 202207-gologlu-biprojective-apns
          - 202200-kaleyski-zero-apn-monomials
          - 202203-kaleyski-ea-invariants
          - 202207-li-quadratic-families
          - 202211-yu-qam
          - 202211-zheng-relative-trace
          - 202306-calderini-bivariate-families
          - 202400-ichanska-qam-search
          - 202402-li-trivariate-families
          - 202503-gologlu-biprojective-equivalence
          - 202508-beierle-millions
          - 202501-taniguchi-affine-subspaces
          - 202512-yu-dimension-ten
          - 202606-kuznetsov-groebner-search
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      - name: Download rebuilt catalog
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: .cache/vbfcatalog

      - name: Run paper tests
        run: |
          julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
          make -C packages/VBFRepro/src/${{ matrix.paper }} test

  perf-smoke:
    name: Performance tooling • ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: catalog-check
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [VBF, VBFCatalog, VBFSearch, VBFRepro]
    env:
      JULIA_LOAD_PATH: '@:@stdlib'
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Cache Julia depot
        uses: julia-actions/cache@v2
      - name: Download rebuilt catalog
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: .cache/vbfcatalog
      - name: Instantiate performance environment
        run: julia --startup-file=no --project=packages/${{ matrix.package }}/perf -e 'using Pkg; Pkg.instantiate()'
      - name: Check performance tooling
        run: julia --startup-file=no --project=packages/${{ matrix.package }}/perf packages/${{ matrix.package }}/perf/test.jl

  catalog-check:
    # Same Julia source/database agreement check as the local hook.
    name: Catalog rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Cache Julia depot
        uses: julia-actions/cache@v2
      - name: Instantiate import environment
        run: julia --startup-file=no --project=packages/VBFCatalog/src/import -e 'using Pkg; Pkg.instantiate(); Pkg.activate("packages/VBFCatalog"); Pkg.instantiate()'
      - name: Rebuild catalog from tracked declarations and pinned originals
        run: make -C packages/VBFCatalog/src/import catalog threads=2
      - name: Check declarations against the rebuilt catalog
        run: .githooks/catalog-check --structure-only
      - name: Share generated catalog with consumer jobs
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: .cache/vbfcatalog/catalog.sqlite
          include-hidden-files: true
          if-no-files-found: error

  # Publishes the prebuilt catalog data (catalog, Beierle members, signature index) as a new
  # version of the Zenodo record in packages/VBFCatalog/src/import/prebuilt.toml, so that
  # `make -C docs data` can download it instead of building it. A version is permanent, so
  # only a push to main publishes, and only when Zenodo has no version for the prebuilt key.
  catalog-data:
    name: Publish prebuilt catalog data
    needs: [catalog-check, test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Two quick merges must not open two Zenodo drafts at the same time.
    concurrency:
      group: zenodo-catalog-data
      cancel-in-progress: false
    env:
      CREATE: ${{ github.event_name == 'workflow_dispatch' && inputs.create_record }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      - name: Download rebuilt catalog
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: .cache/vbfcatalog

      - name: Instantiate import environment
        run: julia --startup-file=no --project=packages/VBFCatalog/src/import -e 'using Pkg; Pkg.instantiate(); Pkg.activate("packages/VBFCatalog"); Pkg.instantiate()'

      - name: Find the Zenodo version of this prebuilt key
        id: need
        run: |
          if grep -q '^concept_recid = ""' packages/VBFCatalog/src/import/prebuilt.toml && [ "$CREATE" != true ]; then
            echo "No Zenodo record yet: run this workflow by hand with create_record to make it."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif julia --startup-file=no --project=packages/VBFCatalog/src/import packages/VBFCatalog/src/import/prebuilt.jl published; then
            echo "Zenodo already has the data of this prebuilt key."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.need.outputs.publish == 'true'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Cache the Beierle et al. 2025 original
        if: steps.need.outputs.publish == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/vbfcatalog/raw/beierle2025
          key: beierle2025-dd6ae0655ba8a299a3d668cfc6cf10bf

      - name: Build members and signature index
        if: steps.need.outputs.publish == 'true'
        run: |
          make -C packages/VBFCatalog/src/import fetch SOURCE=beierle2025
          make -C packages/VBFCatalog/src/import convert SOURCE=beierle2025 threads=4
          make -C packages/VBFCatalog/src/import index threads=4

      - name: Publish to Zenodo
        if: steps.need.outputs.publish == 'true'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: julia --startup-file=no --project=packages/VBFCatalog/src/import packages/VBFCatalog/src/import/prebuilt.jl publish $([ "$CREATE" = true ] && echo --create)

  test:
    name: Test • ${{ matrix.package }} • Julia ${{ matrix.julia }} • ${{ matrix.os }}
    needs: [paper-tests, catalog-check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.12']
        os: [ubuntu-latest]
        package: [VBF, VBFCatalog, VBFSearch, VBFRepro, VBFPaper]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia ${{ matrix.julia }}
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1
        with:
          project: packages/${{ matrix.package }}

      - name: Download rebuilt catalog
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: .cache/vbfcatalog

      - name: Instantiate import environment
        # catalog_storage and catalog_reproducibility run child processes in this environment.
        if: matrix.package == 'VBFCatalog'
        run: julia --startup-file=no --project=packages/VBFCatalog/src/import -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        with:
          project: packages/${{ matrix.package }}
          # Coverage makes the equivalence searches about 17 times slower (110 s instead of 6.4 s for one
          # n=7 automorphism group), so they hit their fixed time limits. Nothing uploads the coverage.
          coverage: false
        env:
          # Hosted runners are small; cap the worker count so the few heavy items (n=6 CCZ enumeration, affine equivalence) don't contend.
          RETESTITEMS_NWORKERS: '2'

      - name: Check shared perf and proposal consumers
        if: matrix.package == 'VBFPaper'
        run: |
          julia --startup-file=no --project=packages/VBFPaper packages/VBFPaper/bench/analysis/test.jl
          julia --startup-file=no --project=packages/VBFPaper packages/VBFRepro/test/proposals/test_catalog_proposals.jl

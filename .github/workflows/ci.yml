name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      create_record:
        description: 'Create the Zenodo record of the prebuilt catalog data (first publication only; permanent)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  paper-tests:
    name: Paper • ${{ matrix.paper }}
    runs-on: ubuntu-latest
    needs: catalog-check
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        paper:
          - 200300-biryukov-equivalence
          - 200506-budaghyan-apn-polynomials
          - 200807-bracken-apn-trinomials
          - 200812-brinkmann-small-apn-classification
          - 200904-budaghyan-trace-apns
          - 200910-budaghyan-apn-families
          - 200900-edel-switching
          - 201103-bracken-quadratic-apns
          - 201205-bracken-du4-permutations
          - 201300-yu-du4-permutations
          - 201408-li-du4-from-apn
          - 201401-zha-inverse-permutations
          - 201510-tang-inverse-bijections
          - 201906-canteaut-butterflies
          - 201911-kaleyski-two-point-changes
          - 201909-taniguchi-quadratic-apns
          - 202008-budaghyan-isotopic-shifts
          - 202009-budaghyan-apn-distance
          - 202011-budaghyan-quadrinomials
          - 202009-calderini-equivalence-classes
          - 202000-kalgin-seven-variable
          - 202012-yu-binary-coefficients
          - 202107-beierle-self-equivalence
          - 202101-budaghyan-generalized-shifts
          - 202100-calderini-construction-relations
          - 202110-chase-walsh-zero-spaces
          - 202201-beierle-quadratic-instances
          - 202205-canteaut-ea-equivalence
          - 202207-gologlu-biprojective-apns
          - 202200-kaleyski-zero-apn-monomials
          - 202203-kaleyski-ea-invariants
          - 202207-li-quadratic-families
          - 202211-yu-qam
          - 202211-zheng-relative-trace
          - 202306-calderini-bivariate-families
          - 202400-ichanska-qam-search
          - 202402-li-trivariate-families
          - 202503-gologlu-biprojective-equivalence
          - 202508-beierle-millions
          - 202501-taniguchi-affine-subspaces
          - 202512-yu-dimension-ten
          - 202606-kuznetsov-groebner-search
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      - name: Download rebuilt catalog
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: .cache/vbfcatalog

      - name: Run paper tests with evidence
        run: |
          julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
          bin/vbfrepro test ${{ matrix.paper }} --evidence evidence

      # One regression record per paper (record.toml, output.log). The docs build collects them;
      # failed runs are kept too, because a failure is evidence as well.
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.paper }}
          path: evidence/
          if-no-files-found: warn

  perf-smoke:
    name: Performance tooling • ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: catalog-check
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [VBF, VBFCatalog, VBFSearch, VBFRepro]
    env:
      JULIA_LOAD_PATH: '@:@stdlib'
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Cache Julia depot
        uses: julia-actions/cache@v2
      - name: Download rebuilt catalog
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: .cache/vbfcatalog
      - name: Instantiate performance environment
        run: julia --startup-file=no --project=packages/${{ matrix.package }}/perf -e 'using Pkg; Pkg.instantiate()'
      - name: Check performance tooling
        run: julia --startup-file=no --project=packages/${{ matrix.package }}/perf packages/${{ matrix.package }}/perf/test.jl

  catalog-check:
    # Same Julia source/database agreement check as the local hook.
    name: Catalog rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Cache Julia depot
        uses: julia-actions/cache@v2
      - name: Instantiate import environment
        run: julia --startup-file=no --project=packages/VBFCatalog/src/import -e 'using Pkg; Pkg.instantiate(); Pkg.activate("packages/VBFCatalog"); Pkg.instantiate()'
      - name: Rebuild catalog from tracked declarations and pinned originals
        run: make -C packages/VBFCatalog/src/import catalog threads=2
      - name: Check declarations against the rebuilt catalog
        run: .githooks/catalog-check --structure-only
      - name: Share generated catalog with consumer jobs
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: .cache/vbfcatalog/catalog.sqlite
          include-hidden-files: true
          if-no-files-found: error

  # Publishes the prebuilt catalog data (catalog, Beierle members, signature index) as a new
  # version of the Zenodo record in packages/VBFCatalog/src/import/prebuilt.toml, so that
  # `make -C docs data` can download it instead of building it. A version is permanent, so
  # only a push to main publishes, and only when Zenodo has no version for the prebuilt key.
  catalog-data:
    name: Publish prebuilt catalog data
    needs: [catalog-check, test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Two quick merges must not open two Zenodo drafts at the same time.
    concurrency:
      group: zenodo-catalog-data
      cancel-in-progress: false
    env:
      CREATE: ${{ github.event_name == 'workflow_dispatch' && inputs.create_record }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      - name: Download rebuilt catalog
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: .cache/vbfcatalog

      - name: Instantiate import environment
        run: julia --startup-file=no --project=packages/VBFCatalog/src/import -e 'using Pkg; Pkg.instantiate(); Pkg.activate("packages/VBFCatalog"); Pkg.instantiate()'

      - name: Find the Zenodo version of this prebuilt key
        id: need
        run: |
          if grep -q '^concept_recid = ""' packages/VBFCatalog/src/import/prebuilt.toml && [ "$CREATE" != true ]; then
            echo "No Zenodo record yet: run this workflow by hand with create_record to make it."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif julia --startup-file=no --project=packages/VBFCatalog/src/import packages/VBFCatalog/src/import/prebuilt.jl published; then
            echo "Zenodo already has the data of this prebuilt key."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.need.outputs.publish == 'true'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      # The expensive parts are cached by the digests of their own inputs, so a change that
      # does not touch them (for example a bibliography entry) does not rebuild them.
      - name: Corpus digests of the rebuilt catalog
        if: steps.need.outputs.publish == 'true'
        id: digests
        run: |
          d=$(julia --startup-file=no --project=packages/VBFCatalog/src/import -e '
            using VBFCatalog, SQLite, DBInterface
            db = load_catalog()
            print(join(sort(["$(r.name):$(r.store_sha256)" for r in DBInterface.execute(db, "SELECT name, store_sha256 FROM bulk_corpora")]), ","))' | sha256sum | cut -c1-64)
          echo "corpora=$d" >> "$GITHUB_OUTPUT"

      # members.sqlite depends only on the pinned Beierle file (sources.toml) and its converter.
      - name: Cache the Beierle et al. 2025 members
        if: steps.need.outputs.publish == 'true'
        id: members
        uses: actions/cache@v4
        with:
          path: .cache/vbfcatalog/members.sqlite
          key: members-${{ hashFiles('packages/VBFCatalog/src/data/sources.toml', 'packages/VBFCatalog/src/import/convert.jl', 'packages/VBFCatalog/src/import/convert_beierle2025.jl', 'packages/VBFCatalog/src/corpus.jl') }}

      # The corpus rows of the signature index depend on the corpus digests and the signature
      # code; the rows of the curated functions are recomputed on every run.
      - name: Cache the signature index
        if: steps.need.outputs.publish == 'true'
        id: index
        uses: actions/cache@v4
        with:
          path: .cache/vbfcatalog/ccz_sigma_index.sqlite
          key: sigma-${{ steps.digests.outputs.corpora }}-${{ hashFiles('packages/VBF/src/**/*.jl', 'packages/VBFCatalog/src/sigma.jl', 'packages/VBFCatalog/src/corpus.jl') }}

      - name: Cache the Beierle et al. 2025 original
        if: steps.need.outputs.publish == 'true' && steps.members.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/vbfcatalog/raw/beierle2025
          key: beierle2025-dd6ae0655ba8a299a3d668cfc6cf10bf

      - name: Build the members
        if: steps.need.outputs.publish == 'true' && steps.members.outputs.cache-hit != 'true'
        run: |
          make -C packages/VBFCatalog/src/import fetch SOURCE=beierle2025
          make -C packages/VBFCatalog/src/import convert SOURCE=beierle2025 threads=4

      - name: Build the signature index
        if: steps.need.outputs.publish == 'true' && steps.index.outputs.cache-hit != 'true'
        run: make -C packages/VBFCatalog/src/import index threads=4

      - name: Refresh the curated rows of the cached signature index
        if: steps.need.outputs.publish == 'true' && steps.index.outputs.cache-hit == 'true'
        run: julia --startup-file=no --project=packages/VBFCatalog/src/import -e 'using VBFCatalog; db = load_catalog(); println(refresh_curated_sigma_index!(db), " curated rows"); close(db)'

      # The browser query database of the portal (docs/portal/POC.md); it is published
      # uncompressed with the other files, so that a snapshot can be queried from Zenodo.
      - name: Build the query database
        if: steps.need.outputs.publish == 'true'
        run: |
          julia --startup-file=no --project=docs/portal -e 'using Pkg; Pkg.instantiate()'
          julia -t 4 --startup-file=no --project=docs/portal -e '
            using VBFPortal, VBFCatalog
            db = load_catalog()
            println(build_query_db(joinpath(VBFCatalog.catalog_data_dir(), "query.sqlite"), db))
            close(db)'

      # A failed publication can leave a draft that blocks the next new version.
      - name: Discard unpublished Zenodo drafts
        if: steps.need.outputs.publish == 'true'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: julia --startup-file=no --project=packages/VBFCatalog/src/import .github/scripts/zenodo_drafts.jl

      - name: Publish to Zenodo
        if: steps.need.outputs.publish == 'true'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: julia --startup-file=no --project=packages/VBFCatalog/src/import packages/VBFCatalog/src/import/prebuilt.jl publish $([ "$CREATE" = true ] && echo --create)

  # Portal data model (docs/portal): identity, snapshots, equivalence levels, and the
  # checks of every paper.toml against the rebuilt catalog. Errors fail the job; review
  # items are printed only.
  portal-model:
    name: Portal model and paper metadata
    needs: catalog-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      - name: Download rebuilt catalog
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: .cache/vbfcatalog

      - name: Instantiate portal environment
        run: julia --startup-file=no --project=docs/portal -e 'using Pkg; Pkg.instantiate()'

      - name: Test the portal model
        run: julia --startup-file=no --project=docs/portal -e 'using Pkg; Pkg.test()'

      - name: Check every paper.toml
        run: |
          julia --startup-file=no --project=docs/portal -e '
            using VBFPortal
            errors, review = check_all()
            foreach(r -> println("review: ", r), review)
            foreach(e -> println("::error::", e), errors)
            println(length(errors), " error(s), ", length(review), " review item(s)")
            exit(isempty(errors) ? 0 : 1)'

  # Preview of the new portal (stage S3 to S5): built from the rebuilt catalog and the
  # evidence of the paper jobs, checked, and kept as an artifact. It is not deployed; the
  # live site still comes from docs/make.jl until the switch.
  portal-preview:
    name: Portal preview
    needs: [catalog-check, paper-tests]
    if: always() && needs.catalog-check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history: the portal dates each reproduction by its last commit

      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      - name: Download rebuilt catalog
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: .cache/vbfcatalog

      - name: Download the evidence of the paper jobs
        uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: evidence
          merge-multiple: true

      - name: Instantiate portal environment
        run: julia --startup-file=no --project=docs/portal -e 'using Pkg; Pkg.instantiate()'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The member view (sqlite-wasm-http) is bundled from the locked npm packages.
      - name: Bundle the browser code
        working-directory: docs/portal/js
        run: npm ci --no-fund --no-audit && node build.mjs

      # The browser tests read members over HTTP Range. The full query database is 759 MiB and
      # needs members.sqlite; a small one with corpora stored in catalog.sqlite is enough.
      - name: Build a small query database for the browser tests
        run: |
          julia --startup-file=no --project=docs/portal -e '
            using VBFPortal, VBFCatalog
            r = build_query_db("query-test.sqlite", load_catalog(); corpora = ["edelpott2009_n8", "taniguchi2019_n8", "galissant2026_n8"])
            println(r)'

      - name: Build and check the portal
        run: julia --startup-file=no --project=docs/portal docs/portal/build.jl --evidence evidence --query query-test.sqlite --copy-query

      - name: Upload the preview
        uses: actions/upload-artifact@v4
        with:
          name: portal-preview
          path: docs/portal/build

      # Browser tests (Playwright, axe-core) against the build served under /VBF.jl/.
      - name: Install the browser tests
        working-directory: docs/portal/test/browser
        run: npm ci --no-fund --no-audit && npx playwright install --with-deps chromium

      - name: Run the browser tests
        working-directory: docs/portal/test/browser
        run: npx playwright test

      - name: Upload the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portal-browser-report
          path: |
            docs/portal/test/browser/report
            docs/portal/test/browser/test-results

  # Builds the Documenter site with the rebuilt catalog and publishes it to GitHub Pages
  # (https://siqueiratf.github.io/VBF.jl/). The site is a GitHub Actions artifact; there is
  # no gh-pages branch. docs.yml builds the same site for pull requests without publishing it.
  docs-pages:
    name: Publish documentation
    needs: catalog-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia 1.12
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      - name: Download rebuilt catalog
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: .cache/vbfcatalog

      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'

      - name: Build
        run: julia --project=docs docs/make.jl

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  test:
    name: Test • ${{ matrix.package }} • Julia ${{ matrix.julia }} • ${{ matrix.os }}
    needs: [paper-tests, catalog-check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.12']
        os: [ubuntu-latest]
        package: [VBF, VBFCatalog, VBFSearch, VBFRepro, VBFPaper]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia ${{ matrix.julia }}
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1
        with:
          project: packages/${{ matrix.package }}

      - name: Download rebuilt catalog
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: .cache/vbfcatalog

      - name: Instantiate import environment
        # catalog_storage and catalog_reproducibility run child processes in this environment.
        if: matrix.package == 'VBFCatalog'
        run: julia --startup-file=no --project=packages/VBFCatalog/src/import -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        with:
          project: packages/${{ matrix.package }}
          # Coverage makes the equivalence searches about 17 times slower (110 s instead of 6.4 s for one
          # n=7 automorphism group), so they hit their fixed time limits. Nothing uploads the coverage.
          coverage: false
        env:
          # Hosted runners are small; cap the worker count so the few heavy items (n=6 CCZ enumeration, affine equivalence) don't contend.
          RETESTITEMS_NWORKERS: '2'

      - name: Check shared perf and proposal consumers
        if: matrix.package == 'VBFPaper'
        run: |
          julia --startup-file=no --project=packages/VBFPaper packages/VBFPaper/bench/analysis/test.jl
          julia --startup-file=no --project=packages/VBFPaper packages/VBFRepro/test/proposals/test_catalog_proposals.jl

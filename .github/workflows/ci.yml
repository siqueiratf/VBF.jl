name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Run JavaScript actions on Node.js 24. Several actions we depend on (directly
# or transitively via the julia-actions wrappers — actions/cache, setup-julia)
# still declare the deprecated Node.js 20 runtime; this opt-in forces them all
# onto Node 24 ahead of GitHub making it the default (2026-06-16). Remove once
# every action ships a Node 24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test • Julia ${{ matrix.julia }} • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.12']
        os: [ubuntu-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia ${{ matrix.julia }}
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      # The repo root is a `[workspace]` (no package); the testable member is
      # `packages/VBF`. `Pkg.test()` there builds the test environment from
      # `packages/VBF/test/Project.toml`, resolved against the shared workspace
      # manifest (regenerated fresh each run — manifests are not committed).
      - name: Build package
        uses: julia-actions/julia-buildpkg@v1
        with:
          project: packages/VBF

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        with:
          project: packages/VBF
        env:
          # Hosted runners are small; cap the worker count so the few heavy
          # items (n=6 CCZ enumeration, affine equivalence) don't contend.
          RETESTITEMS_NWORKERS: '2'

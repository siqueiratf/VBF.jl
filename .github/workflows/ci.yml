name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test • Julia ${{ matrix.julia }} • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.12']
        os: [ubuntu-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia ${{ matrix.julia }}
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1
        with:
          project: packages/VBF

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        with:
          project: packages/VBF
        env:
          # Hosted runners are small; cap the worker count so the few heavy items (n=6 CCZ enumeration, affine equivalence) don't contend.
          RETESTITEMS_NWORKERS: '2'

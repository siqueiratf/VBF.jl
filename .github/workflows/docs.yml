name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# This workflow only builds the docs to catch broken doctests and cross-references. Nothing deploys them: build them locally with `make -C docs build`.
permissions:
  contents: read

# See the note in ci.yml: force JS actions onto Node 24 ahead of the GitHub default switch, until every action we use ships a Node 24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docs:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'

      - name: Build
        run: julia --project=docs docs/make.jl
        env:
          JULIA_DEBUG: Documenter

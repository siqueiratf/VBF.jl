# n = 4 APN functions.
#
# Up to CCZ-equivalence there is exactly one APN class on F₂⁴: the Gold
# function x³ over GF(2⁴) (Carlet, "Vectorial Boolean Functions for
# Cryptography", 2010). It is NOT a permutation
# (gcd(3, 2⁴ - 1) = 3 ≠ 1) — useful for testing the catalog's
# is_permutation = false codepath.

schema_version = 1

[[apn_functions]]
name           = "n4_Gold_x3"
description    = "Gold APN function x^3 over GF(2^4) with irreducible x^4 + x + 1. The unique APN class on F₂⁴ up to CCZ-equivalence."
n              = 4
m              = 4
is_permutation = false
algebraic_form = "x^3 in GF(2^4), modulus x^4 + x + 1"
bib_key        = "Nyberg1994"
source         = "Nyberg, 'Differentially uniform mappings for cryptography', EUROCRYPT 1994 (APN definition); Gold APN family from Gold, IEEE Trans. Inform. Theory, 1968."
lut            = [0, 1, 8, 15, 12, 10, 1, 1, 10, 15, 15, 12, 8, 10, 8, 12]
